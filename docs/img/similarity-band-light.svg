<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 306" width="800" height="306" role="img" aria-label="Cosine similarity number line from 0.60 to 1.00. True duplicates span 0.70 to 0.80. Pairs that must not merge appear at 0.679 and 0.832, on both sides of the duplicate band. The 0.90 auto-merge threshold fired zero times.">
  <style>
    .ink   { fill: #24292f; }
    .muted { fill: #57606a; }
    .acc   { fill: #0d6e63; }
    .nev   { fill: #a82d3a; }
    .gat   { fill: #9a5b0b; }
    .s-ink { stroke: #24292f; }
    .s-acc { stroke: #0d6e63; }
    .s-nev { stroke: #a82d3a; }
    .s-gat { stroke: #9a5b0b; }
    .lbl   { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; }
    .txt   { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, sans-serif; font-size: 11px; }
    .bold  { font-weight: 700; }
  </style>

  <!-- true duplicates band -->
  <text x="14" y="46" class="acc lbl" letter-spacing="0.9">TRUE DUPLICATES</text>
  <rect x="235" y="56" width="155" height="26" rx="3" fill="#0d6e63" fill-opacity="0.18"/>
  <rect x="235" y="56" width="155" height="26" rx="3" fill="none" class="s-acc" stroke-width="1.5"/>
  <text x="312" y="74" class="acc lbl" text-anchor="middle">0.70 – 0.80</text>

  <!-- must not merge -->
  <text x="14" y="118" class="nev lbl" letter-spacing="0.9">MUST NOT MERGE</text>
  <rect x="188" y="128" width="30" height="26" rx="3" fill="#a82d3a" fill-opacity="0.18"/>
  <rect x="188" y="128" width="30" height="26" rx="3" fill="none" class="s-nev" stroke-width="1.5"/>
  <rect x="425" y="128" width="30" height="26" rx="3" fill="#a82d3a" fill-opacity="0.18"/>
  <rect x="425" y="128" width="30" height="26" rx="3" fill="none" class="s-nev" stroke-width="1.5"/>

  <text x="203" y="176" class="nev lbl" text-anchor="middle">0.679</text>
  <text x="203" y="191" class="muted txt" text-anchor="middle">Login vs Dashboard</text>

  <text x="440" y="176" class="nev lbl" text-anchor="middle">0.832</text>
  <text x="450" y="191" class="muted txt" text-anchor="middle">Landing Page (screen) vs</text>
  <text x="450" y="205" class="muted txt" text-anchor="middle">Landing Page Journey (flow)</text>

  <!-- byte-identical marker -->
  <line x1="387" y1="52" x2="387" y2="90" class="s-ink" stroke-width="1.3"/>
  <circle cx="387" cy="56" r="3" class="ink"/>
  <text x="396" y="43" class="ink lbl">0.798</text>
  <text x="396" y="29" class="muted txt">byte-identical titles</text>

  <!-- axis -->
  <line x1="80" y1="240" x2="700" y2="240" class="s-ink" stroke-width="1.2"/>
  <g class="muted lbl" text-anchor="middle">
    <line x1="80"  y1="240" x2="80"  y2="246" class="s-ink" stroke-width="1.2"/><text x="80"  y="262">0.60</text>
    <line x1="235" y1="240" x2="235" y2="246" class="s-ink" stroke-width="1.2"/><text x="235" y="262">0.70</text>
    <line x1="390" y1="240" x2="390" y2="246" class="s-ink" stroke-width="1.2"/><text x="390" y="262">0.80</text>
    <line x1="545" y1="240" x2="545" y2="246" class="s-ink" stroke-width="1.2"/><text x="545" y="262">0.90</text>
    <line x1="700" y1="240" x2="700" y2="246" class="s-ink" stroke-width="1.2"/><text x="700" y="262">1.00</text>
  </g>
  <text x="390" y="288" class="muted lbl" letter-spacing="1.2" text-anchor="middle">COSINE SIMILARITY</text>

  <!-- thresholds -->
  <line x1="297" y1="22" x2="297" y2="240" class="s-gat" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="303" y="224" class="gat lbl">0.74 ask the model</text>

  <line x1="545" y1="22" x2="545" y2="240" class="s-ink" stroke-width="1.3" stroke-dasharray="4 4" stroke-opacity="0.55"/>
  <text x="551" y="106" class="ink lbl">0.90 auto-merge</text>
  <text x="551" y="121" class="nev txt bold">fired zero times</text>
</svg>
