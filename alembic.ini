# Alembic configuration.
#
# sqlalchemy.url is deliberately empty: the connection string is read from the
# DATABASE_URL environment variable inside migrations/env.py. A URL committed
# here would be either wrong for every host or a leaked credential.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# Migration filenames are prefixed with a UTC timestamp so `ls` orders them the
# way the history does; revision ids alone sort arbitrarily.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = UTC

sqlalchemy.url =


[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
